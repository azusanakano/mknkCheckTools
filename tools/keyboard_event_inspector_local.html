<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キーボードチェック | mknkCheckTools v1.2.4</title>
  <style>
    :root {
      color-scheme: light;
      --border: #dee2e6;
      --muted: #6c757d;
      --light: #f8f9fa;
      --primary: #0d6efd;
      --danger: #dc3545;
      --success: #198754;
      --secondary: #6c757d;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      color: #212529;
      background: #fff;
      font-family: "Meiryo UI", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }
    button, textarea, input { font: inherit; }
    .container {
      width: 100%;
      max-width: 1320px;
      margin-inline: auto;
      padding-inline: 0.75rem;
    }
    .py-4 { padding-block: 1.5rem; }
    .d-flex { display: flex; }
    .flex-column { flex-direction: column; }
    .justify-content-between { justify-content: space-between; }
    .align-items-center { align-items: center; }
    .align-items-stretch { align-items: stretch; }
    .gap-3 { gap: 1rem; }
    .mb-0 { margin-bottom: 0; }
    .mb-3 { margin-bottom: 1rem; }
    .mb-4 { margin-bottom: 1.5rem; }
    .m-0 { margin: 0; }
    .p-0 { padding: 0 !important; }
    .h-100 { height: 100%; }
    .h3 { margin-top: 0; font-size: 1.75rem; font-weight: 500; line-height: 1.2; }
    .text-muted { color: var(--muted); }
    .fw-semibold { font-weight: 600; }
    .text-nowrap { white-space: nowrap; }
    .form-label { display: inline-block; margin-bottom: 0.5rem; }
    .form-control {
      display: block;
      width: 100%;
      padding: 0.375rem 0.75rem;
      color: #212529;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      line-height: 1.5;
      resize: vertical;
    }
    .form-control:focus {
      border-color: #86b7fe;
      outline: 0;
      box-shadow: 0 0 0 0.25rem rgb(13 110 253 / 25%);
    }
    .form-check {
      position: relative;
      display: block;
      min-height: 1.5rem;
      padding-left: 2.5em;
    }
    .form-check-input {
      appearance: none;
      float: left;
      width: 2em;
      height: 1em;
      margin: 0.25em 0 0 -2.5em;
      background-color: #fff;
      background-image: radial-gradient(circle at 25% 50%, #fff 0 31%, transparent 34%);
      background-repeat: no-repeat;
      border: 1px solid rgb(0 0 0 / 25%);
      border-radius: 2em;
      cursor: pointer;
      transition: background-position 0.15s ease-in-out, background-color 0.15s ease-in-out;
    }
    .form-check-input:not(:checked) { background-color: #adb5bd; }
    .form-check-input:checked {
      background-color: var(--primary);
      background-image: radial-gradient(circle at 75% 50%, #fff 0 31%, transparent 34%);
      border-color: var(--primary);
    }
    .form-check-input:focus { outline: 3px solid rgb(13 110 253 / 25%); }
    .form-check-label { cursor: pointer; }
    .badge {
      display: inline-block;
      padding: 0.35em 0.65em;
      color: #fff;
      font-size: 0.75em;
      font-weight: 700;
      line-height: 1;
      border-radius: 0.375rem;
    }
    .bg-danger { background-color: var(--danger); }
    .bg-success { background-color: var(--success); }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    }
    .g-4 { gap: 1.5rem; }
    .col-lg-5, .col-lg-7 { min-width: 0; }
    .card {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 100%;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgb(0 0 0 / 17.5%);
      border-radius: 0.375rem;
    }
    .shadow-sm { box-shadow: 0 0.125rem 0.25rem rgb(0 0 0 / 7.5%); }
    .card-header {
      padding: 0.5rem 1rem;
      background: rgb(33 37 41 / 3%);
      border-bottom: 1px solid rgb(0 0 0 / 17.5%);
      border-radius: 0.375rem 0.375rem 0 0;
    }
    .card-body { flex: 1 1 auto; padding: 1rem; }
    .table-responsive { overflow-x: auto; }
    .table {
      width: 100%;
      color: #212529;
      border-collapse: collapse;
    }
    .table th, .table td {
      padding: 0.5rem;
      text-align: center;
      vertical-align: middle;
      border: 1px solid var(--border);
    }
    .table-light th { background: var(--light); }
    .btn-group { display: inline-flex; vertical-align: middle; }
    .btn {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      color: #212529;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      line-height: 1.5;
      text-align: center;
      cursor: pointer;
    }
    .btn-outline-secondary { color: var(--secondary); border-color: var(--secondary); }
    .btn-outline-secondary:hover, .btn-outline-secondary:focus-visible {
      color: #fff;
      background: var(--secondary);
    }
    .btn-group > .btn:not(:first-child) {
      margin-left: -1px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
    .btn-group > .btn:not(:last-child) {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .border-0 { border: 0 !important; }
    .log-header { flex-wrap: wrap; gap: 0.5rem; }
    .log-help {
      margin: 0;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    #logContainer {
      display: block;
      flex: 1 1 auto;
      height: calc(17 * 1.4rem + 0.75rem);
      min-height: 340px;
      font-family: inherit;
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow: auto;
      border-radius: 0 0 0.375rem 0.375rem;
    }
    #logContainer:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
    }
    .key-highlight { color: var(--danger); font-weight: 700; font-size: calc(1em + 2px); }
    @media (max-width: 991.98px) {
      .row { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 575.98px) {
      header { align-items: flex-start !important; flex-direction: column; gap: 0.25rem; }
      .h3 { font-size: 1.5rem; }
    }

    /* Package navigation stays outside the keyboard test controls. */
    .package-nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem;font-size:.8rem;color:#657583}
    .package-nav a{display:inline-flex;align-items:center;min-height:36px;padding:.35rem .7rem;border:1px solid #ced9e1;border-radius:7px;color:#244d71;text-decoration:none;background:#f7f9fb}
    .package-nav a:hover{background:#eaf1f8;border-color:#91aac0}
    .package-nav a:focus-visible{outline:3px solid #0d6efd;outline-offset:3px}
  </style>
</head>
<body class="container py-4">
  <nav class="package-nav" aria-label="ツールメニュー"><a href="../index.html">← メニューへ戻る</a><span>mknkCheckTools v1.2.4</span></nav>
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">キーボードチェック</h1>
    <span class="text-muted">v20261103</span>
  </header>

  <div class="mb-3">
    <label for="inputArea" class="form-label fw-semibold">入力テストエリア</label>
    <textarea id="inputArea" class="form-control" rows="4" placeholder="ここに試し打ちします…"></textarea>
  </div>

  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="form-check form-switch m-0">
      <input class="form-check-input" type="checkbox" role="switch" id="blockSpecialKeys" checked>
      <label class="form-check-label" for="blockSpecialKeys">特殊キーをブロック</label>
    </div>
    <span id="filterStatus" class="badge bg-danger">ブロック中</span>
  </div>

  <div class="row g-4 align-items-stretch">
    <!-- イベントテーブル -->
    <div class="col-lg-5">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Event Properties</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-bordered mb-0">
              <thead class="table-light text-nowrap">
                <tr><th>Property</th><th>keydown</th><th>keypress</th><th>keyup</th></tr>
              </thead>
              <tbody>
                <tr><th>key</th>       <td id="downKey">—</td><td id="pressKey">—</td><td id="upKey">—</td></tr>
                <tr><th>code</th>      <td id="downCode">—</td><td id="pressCode">—</td><td id="upCode">—</td></tr>
                <tr><th>target</th>    <td id="targetCell" colspan="3">—</td></tr>
                <tr><th>character</th> <td id="charCell" colspan="3">—</td></tr>
                <tr><th>shiftKey</th>  <td id="downShift">—</td><td id="pressShift">—</td><td id="upShift">—</td></tr>
                <tr><th>ctrlKey</th>   <td id="downCtrl">—</td><td id="pressCtrl">—</td><td id="upCtrl">—</td></tr>
                <tr><th>altKey</th>    <td id="downAlt">—</td><td id="pressAlt">—</td><td id="upAlt">—</td></tr>
                <tr><th>metaKey</th>   <td id="downMeta">—</td><td id="pressMeta">—</td><td id="upMeta">—</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- イベントログ -->
    <div class="col-lg-7">
      <div class="card shadow-sm h-100 d-flex flex-column">
        <div class="card-header log-header d-flex justify-content-between align-items-center fw-semibold">
          <span>イベントログ（最新が上）</span>
          <div class="btn-group btn-group-sm" role="group">
            <button id="clearLog" class="btn btn-outline-secondary">クリア</button>
            <button id="downloadLog" class="btn btn-outline-secondary">ダウンロード</button>
          </div>
        </div>
        <div class="card-body p-0 d-flex flex-column">
          <p id="logHelp" class="log-help text-muted">記録時刻は端末のローカル時刻です。修飾キーは押されているものだけを表示します。</p>
          <div id="logContainer" class="form-control border-0" role="textbox" tabindex="0" aria-readonly="true" aria-multiline="true" aria-label="イベントログ" aria-describedby="logHelp" data-placeholder="キーを押すと、日時・操作・キーの詳細をここに表示します。"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main script -->
  <script>
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);

    // DOM elements
    const blockSpecialKeys = $("blockSpecialKeys");
    const filterStatus  = $("filterStatus");
    const logContainer  = $("logContainer");

    // badge updater
    const updateBadge = () => {
      const active = blockSpecialKeys.checked;
      filterStatus.textContent = active ? "ブロック中" : "ブロック解除";
      filterStatus.classList.toggle("bg-danger", active);
      filterStatus.classList.toggle("bg-success", !active);
    };
    updateBadge();
    blockSpecialKeys.addEventListener("change", updateBadge);

    // table cells list
    const cells = [
      "downKey","pressKey","upKey","downCode","pressCode","upCode","targetCell","charCell",
      "downShift","pressShift","upShift","downCtrl","pressCtrl","upCtrl","downAlt","pressAlt","upAlt",
      "downMeta","pressMeta","upMeta"
    ];
    const keyHighlightTimers = new WeakMap();
    const clearKeyHighlight = (element) => {
      clearTimeout(keyHighlightTimers.get(element));
      keyHighlightTimers.delete(element);
      element.classList.toggle("key-highlight", false);
    };
    const highlightKey = (element) => {
      clearKeyHighlight(element);
      element.classList.toggle("key-highlight", true);
      keyHighlightTimers.set(element, setTimeout(() => clearKeyHighlight(element), 500));
    };
    const clearCells = () => cells.forEach(id => {
      const cell = $(id);
      clearKeyHighlight(cell);
      cell.textContent = "—";
    });

    // Allow when filter is active: any single printable char (incl. symbols), or modifier keys.
    const isAllowed = (e) => {
      if (!blockSpecialKeys.checked) return true;
      if (typeof e.key === "string" && e.key.length === 1) return true; // letter/number/symbol
      if (e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return true;
      return false;
    };

    // PrintScreen is reported differently depending on the browser/keyboard driver.
    // keyCode 44 must only be accepted on keydown/keyup because a comma keypress
    // can also have the character code 44.
    const normalizeKeyName = (value) => String(value ?? "")
      .toLowerCase()
      .replace(/[\s_-]/g, "");
    const printScreenNames = new Set([
      "printscreen", "snapshot", "prtsc", "prtscr", "prtscn"
    ]);
    const isPrintScreen = (e) => {
      const key  = normalizeKeyName(e.key);
      const code = normalizeKeyName(e.code);
      const keyIdentifier = normalizeKeyName(e.keyIdentifier);
      const legacyCode = Number(e.keyCode || e.which || 0);
      const legacyPrintScreen =
        (e.type === "keydown" || e.type === "keyup") && legacyCode === 44;

      return printScreenNames.has(key) ||
        printScreenNames.has(code) ||
        printScreenNames.has(keyIdentifier) ||
        legacyPrintScreen;
    };

    // Special blocked keys (when filter active)
    const isSpecialBlocked = (e) => {
      if (!blockSpecialKeys.checked) return false;
      const k = e.key || "";
      const c = e.code || "";
      // PrintScreen variants + KanaMode + Convert
      return (
        isPrintScreen(e) ||
        k === "KanaMode"   || c === "KanaMode"   ||
        k === "Convert"    || c === "Convert"
      );
    };

    const blockSpecialEvent = (evt) => {
      evt.preventDefault();
      evt.stopPropagation();
      evt.stopImmediatePropagation();
      // Legacy fallback for older browser event implementations.
      evt.returnValue = false;
      evt.cancelBubble = true;
    };

    // log helpers
    let count = 0;
    const prependLog = (heading, keyLabel, details) => {
      const entry = document.createElement("span");
      const key = document.createElement("span");
      key.classList.toggle("log-key", true);
      key.textContent = keyLabel;
      // Text nodes keep key names literal and copy/download formatting unchanged.
      entry.append(`${heading}\n  キー: `, key, details);
      if (logContainer.firstChild) logContainer.prepend("\n\n");
      logContainer.prepend(entry);
      highlightKey(key);
    };
    const formatLogTime = (date) => {
      const pad = (value, width = 2) => String(value).padStart(width, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
        `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${pad(date.getMilliseconds(), 3)}`;
    };
    const quoteLogValue = (value) => JSON.stringify(String(value ?? ""))
      .replace(/[\u0085\u2028\u2029]/g, (character) => `\\u${character.charCodeAt(0).toString(16).padStart(4, "0")}`);
    const eventLabels = { keydown: "押下", keypress: "キー入力通知", keyup: "解放" };
    const locationLabels = ["標準", "左", "右", "テンキー"];
    const updateRow = (phase, evt) => {
      $(`${phase}Key`).textContent   = evt.key ?? "";
      highlightKey($(`${phase}Key`));
      $(`${phase}Code`).textContent  = evt.code ?? "";
      $(`${phase}Shift`).textContent = evt.shiftKey;
      $(`${phase}Ctrl`).textContent  = evt.ctrlKey;
      $(`${phase}Alt`).textContent   = evt.altKey;
      $(`${phase}Meta`).textContent  = evt.metaKey;
    };
    const showTarget = (evt) => $("targetCell").textContent = evt.target?.nodeName ?? "";
    const showChar   = (evt) => $("charCell").textContent   = (evt.key && evt.key.length === 1) ? evt.key : "—";
    const log = (evt) => {
      const key = String(evt.key ?? "");
      const keyLabel = key === " " ? 'スペース (" ")' : key === "" ? '未取得 ("")' : quoteLogValue(key);
      const location = evt.location ?? 0;
      const modifiers = [["Shift", evt.shiftKey], ["Ctrl", evt.ctrlKey], ["Alt", evt.altKey], ["Meta", evt.metaKey]]
        .filter(([, pressed]) => pressed).map(([name]) => name).join(" + ") || "なし";
      const trusted = evt.isTrusted === true;
      prependLog(
        `#${++count} [${formatLogTime(new Date())}] ${eventLabels[evt.type] ?? evt.type} (${evt.type})`,
        keyLabel,
        [
          ` | 物理キー (code): ${quoteLogValue(evt.code)} | 位置: ${locationLabels[location] ?? "不明"} (${location})`,
          `  修飾キー: ${modifiers} | 長押し反復: ${evt.repeat ? "あり" : "なし"}`,
          `  発生元: ${trusted ? "ブラウザー" : "スクリプト"} (isTrusted=${trusted}) | keyCode=${evt.keyCode ?? 0} | which=${evt.which ?? 0}`
        ].join("\n")
      );
    };

    const isControlNavigation = evt => evt.target instanceof Element && (
      logContainer.contains(evt.target) ||
      Boolean(evt.target.closest(".package-nav")) ||
      ["Tab", "Enter", " "].includes(evt.key) && Boolean(evt.target.closest("button, input[type=checkbox]"))
    );

    // Capture at window level so PrintScreen is handled before page listeners.
    const captureOptions = { capture: true, passive: false };
    window.addEventListener("keydown", (evt) => {
      if (isControlNavigation(evt)) {
        if (logContainer.contains(evt.target) && (evt.ctrlKey || evt.metaKey) &&
            !evt.altKey && evt.key?.toLowerCase() === "a") {
          evt.preventDefault();
          window.getSelection()?.selectAllChildren(logContainer);
        }
        return;
      }
      clearCells();
      updateRow("down", evt);
      showTarget(evt);
      log(evt);
      if (isSpecialBlocked(evt)) { blockSpecialEvent(evt); return; }
      if (!isAllowed(evt)) evt.preventDefault();
    }, captureOptions);
    window.addEventListener("keypress", (evt) => {
      if (isControlNavigation(evt)) return;
      updateRow("press", evt);
      showTarget(evt);
      showChar(evt);
      log(evt);
      if (isSpecialBlocked(evt)) { blockSpecialEvent(evt); return; }
      if (!isAllowed(evt)) evt.preventDefault();
    }, captureOptions);
    window.addEventListener("keyup", (evt) => {
      if (isControlNavigation(evt)) return;
      updateRow("up", evt);
      showTarget(evt);
      log(evt);
      if (isSpecialBlocked(evt)) { blockSpecialEvent(evt); return; }
      if (!isAllowed(evt)) evt.preventDefault();
    }, captureOptions);

    // buttons
    $("clearLog").addEventListener("click", () => { logContainer.textContent = ""; count = 0; });
    $("downloadLog").addEventListener("click", () => {
      // normalize EOLs to CRLF for downloaded file
      const header = "# mknkCheckTools v1.2.4 / Keyboard v20261103\n" +
        "# Log format: 2\n" +
        "# キーボードイベントログ（最新が上 / 記録時刻は端末のローカル時刻）\n";
      const data = `${header}\n${logContainer.textContent}`.replace(/\r?\n/g, "\r\n");
      const blob = new Blob(["\uFEFF", data], { type: "text/plain;charset=utf-8" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = `keylog_${Date.now()}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    console.assert($("inputArea") instanceof HTMLElement, "[TEST] inputArea exists");
  })();
  </script>
</body>
</html>
